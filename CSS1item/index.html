<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Css item</title>
  </head>
  <body>
    <div id="item1" class="mati-item">
      <img
        src="https://fastly.picsum.photos/id/405/300/300.jpg?hmac=FmYwH1qcQZAzlBIL-wfUhcQaYJynrAW9ePgMcNqKJW8"
        alt="Macarrons"
        width="200px"
        height="200px"
      />
      <label for="macarrons">Macarrons</label>
      <div class="buttons">
        <input type="button" value="-" />
        <div class="fixed">
          <input type="text" id="macarrons" name="macarrons" min="0" max="9" />
        </div>
        <input type="button" value="+" />
      </div>
    </div>

    <div id="item2" class="mati-item">
      <img
        src="https://picsum.photos/id/237/536/354"
        alt="Bacon amb formatge"
        width="200px"
        height="200px"
      />
      <label for="bacon">Bacon amb formatge</label>
      <div class="buttons">
        <input type="button" value="-" />
        <div class="fixed">
          <input type="text" id="bacon" name="bacon" min="0" max="9" />
        </div>
        <input type="button" value="+" />
      </div>
    </div>
  </body>
</html>
